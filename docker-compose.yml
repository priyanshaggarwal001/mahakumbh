services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=/app/data/database.sqlite
    volumes:
      - mahakumbh_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3001
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mahakumbh_data:
